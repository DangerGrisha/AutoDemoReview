[package]
name = "viewer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Hand-picked minimal feature set. The "3d" umbrella we used before force-pulls
# provably-unused subsystems (bevy_text + embedded default_font, tonemapping +
# SMAA LUTs, ktx2 + zstd, morph targets, mikktspace, hdr, picking, gamepad,
# clipboard, custom cursor, post-processing, world serialization) — dead weight
# in the wasm. This list keeps exactly what the viewer uses: winit canvas +
# WebGL2, PBR StandardMaterial, glTF scenes with skeletal animation, gizmos,
# PNG loading for the radar texture and JPEG for the player model's embedded
# Mixamo textures (dropping "jpeg" makes player.glb fail to load entirely —
# no player models). "ktx2" reads the textured map's block-compressed textures, without
# zstd: Brotli on the server does that better and the wasm has only one thread.
# Safe to extend if a compile error names a missing feature.
bevy = { version = "0.19", default-features = false, features = [
    "std", "async_executor", "web", "webgl2",
    "bevy_winit", "bevy_window", "bevy_asset", "bevy_state", "bevy_log",
    "bevy_render", "bevy_core_pipeline", "bevy_pbr",
    "bevy_gltf", "bevy_animation", "gltf_animation",
    "bevy_gizmos", "bevy_gizmos_render",
    "bevy_scene", "reflect_auto_register", "png", "jpeg", "ktx2",
] }
c2r3 = { path = "../codec" }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
